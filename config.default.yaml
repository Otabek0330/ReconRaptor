# Recon Raptor — default configuration
# ─────────────────────────────────────────────────────────────
# Run `recon_raptor config --init` to copy this to config.yaml
# Edit config.yaml — never edit this file directly.
# Run `recon_raptor config --validate` to check for errors.
# ─────────────────────────────────────────────────────────────

# ── Wordlists (TWO SEPARATE FILES) ────────────────────────────
# wordlist      → subdomain labels: "api", "dev", "mail"        (-w)
# dir_wordlist  → web paths:        "admin", "login", ".env"    (-dw)
# Leave either empty to skip that phase. Any language is accepted —
# DNS-invalid entries are stripped and deduplicated automatically.
wordlist:     ""
dir_wordlist: ""

# ── Performance ───────────────────────────────────────────────
threads:        50     # HTTP probe + traversal concurrency
brute_threads:  500    # DNS bruteforce/resolution threads (dnsx path)
rate:           150    # max requests/sec for ffuf traversal
timeout:        10     # per-request timeout (seconds)
depth:          2      # directory traversal recursion depth
traversal_jobs: 3      # alive hosts scanned in parallel

# Run gobuster + dirsearch + ffuf together instead of a single primary
# tool. Off by default — running all three ~triples the request volume
# for near-identical results.
traversal_all_tools: false

# ── HTTP ports to probe (fallback when no port scan data) ─────
ports:
  - 80
  - 443
  - 8080
  - 8443

# ── Port scanning (naabu) ─────────────────────────────────────
port_scan:
  top_ports: 1000      # scan top N common ports
  rate:      1000      # packets/sec
  # ports: [80, 443, 8080]   # optional: exact ports instead of top_ports

# ── Directory traversal file extensions ──────────────────────
# NOTE: only the first 8 are used at scan time — each extension
# multiplies requests per word, so keep the important ones first.
extensions:
  - php
  - asp
  - aspx
  - html
  - js
  - json
  - bak
  - zip
  - env
  - config
  - sql

# ── Paths ─────────────────────────────────────────────────────
resolvers:  ./resolvers.txt   # DNS resolvers, one IP per line
output_dir: ./results         # created automatically

# Optional: override where the ipinfo MMDB is stored/looked up.
# mmdb_path: ./ipinfo_lite.mmdb

# ── API tokens (all optional) ─────────────────────────────────
tokens:
  ipinfo: ""           # https://ipinfo.io — leave empty to use ip-api.com

# ── Phase toggles ─────────────────────────────────────────────
# Set a phase to false to permanently skip it. Use --skip-* flags for
# per-run overrides.
phases:
  passive_enum:   true    # subfinder, assetfinder, findomain, crt.sh
  bruteforce:     true    # wordlist-based DNS resolution
  dns_resolve:    true    # A/AAAA/CNAME/MX/NS/TXT (+ _dmarc/DKIM) via dnsx
  port_scan:      true    # naabu port scan on public IPs
  http_probe:     true    # live host detection via httpx
  traversal:      true    # directory bruteforce on live hosts
  ip_enrichment:  true    # ASN / org / country / CDN vs cloud detection
  harvest:        true    # robots.txt + sitemap path harvesting
  email_security: true    # SPF / DMARC / DKIM analysis

# ── Optional extras ───────────────────────────────────────────
extras:
  zone_transfer:       true    # attempt AXFR against each domain's NS
  wayback_urls:        false   # harvest historical URLs via gau (not wired yet)
  screenshots:         false   # capture screenshots via gowitness (not wired yet)
  subdomain_takeover:  false   # check CNAMEs for dangling services (not wired yet)